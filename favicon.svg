<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Subtle Blueprint Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="40" x2="80" y2="472" />
    <line x1="160" y1="40" x2="160" y2="472" />
    <line x1="240" y1="40" x2="240" y2="472" />
    <line x1="320" y1="40" x2="320" y2="472" />
    <line x1="400" y1="40" x2="400" y2="472" />
    <line x1="40" y1="80" x2="472" y2="80" />
    <line x1="40" y1="160" x2="472" y2="160" />
    <line x1="40" y1="240" x2="472" y2="240" />
    <line x1="40" y1="320" x2="472" y2="320" />
    <line x1="40" y1="400" x2="472" y2="400" />
  </g>

  <!-- Main Planning Emblem: Monogram P with Modular Production Tracks -->
  <g filter="url(#shadow)">
    <!-- Vertical Spine of P -->
    <rect x="120" y="104" width="46" height="304" rx="23" fill="url(#pGrad)" />

    <!-- Top Track / Bar of P -->
    <rect x="180" y="104" width="150" height="42" rx="21" fill="url(#barGrad1)" />

    <!-- Loop of P connecting back -->
    <path d="M 290 104 C 365 104 365 240 290 240 L 180 240" fill="none" stroke="url(#barGrad2)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Production Track 2 (Line B) -->
    <rect x="180" y="272" width="115" height="34" rx="17" fill="#475569" />

    <!-- Production Track 3 (Line C) -->
    <rect x="180" y="330" width="70" height="34" rx="17" fill="#334155" />
  </g>

  <!-- QC Checker Verified Badge (Bottom Right) -->
  <g filter="url(#shadow)">
    <circle cx="370" cy="358" r="68" fill="url(#badgeGrad)" stroke="#1e293b" stroke-width="8" />
    <path d="M 342 358 L 364 380 L 400 338" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>