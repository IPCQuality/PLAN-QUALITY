<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAP LIQUID 3</title>
    <link rel="manifest" href="/pwa/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlanMaker" />
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="mode-landing">
    <header>
      <div class="header-left">
        <button
          id="sidebarToggleBtn"
          class="btn control-landing"
          onclick="toggleSidePanel()"
          title="Filter dan Status"
        >
          Menu
        </button>
      </div>
      <div class="brand brand-center">
        MAP LIQUID 3
      </div>
      <div class="controls">
        <span id="offlineIndicator" style="display:none; font-size:11px; padding:4px 8px; background:#d97706; color:#fff; border-radius:4px; font-weight:700;">Offline</span>
        <button id="settingsBtn" class="btn" onclick="handleSettingsClick()" title="Pengaturan dan Menu Map">
          Setelan
        </button>
        <button
          id="menuHeatmapBtn"
          class="btn btn-danger control-landing"
          onclick="toggleHeatmap()"
        >
          Heatmap Nonaktif
        </button>
        <button
          id="goConfigBtn"
          class="btn btn-primary control-landing"
          onclick="goToConfig()"
        >
          NEXT
        </button>
      </div>
    </header>

    <div class="toast-container" id="toastContainer"></div>

    <div class="main-layout">
      <div class="side-panel closed control-landing" id="sidePanel">
        <div class="panel-header"><h3>Filter & Status</h3></div>
        <div class="panel-body">
          <div>
            <div class="ws-group-title" style="margin-bottom: 6px">KONTROL MESIN</div>
            <div style="display: flex; gap: 8px">
              <button
                class="btn btn-success"
                style="flex: 1; font-size: 0.75rem"
                onclick="setAllMachinesRunning()"
              >
                Run All
              </button>
              <button
                class="btn btn-danger"
                style="flex: 1; font-size: 0.75rem"
                onclick="setAllMachinesOff()"
              >
                All Off
              </button>
            </div>
          </div>

          <div>
            <div class="ws-group-title" style="margin-bottom: 6px">KONTROL CQI</div>
            <div style="display: flex; gap: 8px">
              <button
                class="btn btn-primary"
                style="flex: 1; font-size: 0.75rem"
                onclick="setAllCqiReady()"
              >
                Ready All
              </button>
              <button
                class="btn btn-danger"
                style="flex: 1; font-size: 0.75rem"
                onclick="setAllCqiOff()"
              >
                All Off
              </button>
            </div>
          </div>

          <div class="stats-box">
            <div class="stat-line">
              <span>Mesin Running:</span>
              <span class="stat-val" id="statMachine">0 / 0</span>
            </div>
            <div class="stat-line">
              <span>CQI Terpakai:</span>
              <span class="stat-val" id="statCqi">0 / 0</span>
            </div>
          </div>

          <div id="wsBtnContainer"></div>
        </div>
      </div>

      <div class="map-viewport" id="mapViewport">
        <div class="grid-wrapper" id="gridWrapper">
          <div class="factory-grid" id="factoryGrid"></div>
        </div>
      </div>

      <div class="zoom-controls">
        <button
          class="zoom-btn"
          id="zoomOutBtn"
          onclick="zoomOut()"
          title="Perkecil Tampilan"
        >
          -
        </button>
        <span class="zoom-badge" id="zoomBadge">100%</span>
        <button
          class="zoom-btn"
          id="zoomInBtn"
          onclick="zoomIn()"
          title="Perbesar Tampilan"
        >
          +
        </button>
        <button
          class="zoom-btn"
          id="zoomResetBtn"
          onclick="resetZoom()"
          title="Kembalikan Tampilan"
        >
          ↺
        </button>
      </div>
    </div>

    <!-- MODAL PENGATURAN -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-card">
        <h3>Pengaturan Map</h3>
        <div class="menu-list">
          <button class="btn" onclick="activateEditMode()">Edit Map</button>
          <button class="btn" onclick="openNodeModal('machine')">
            Tambah Mesin
          </button>
          <button class="btn" onclick="openNodeModal('cqi')">
            Tambah CQI
          </button>
          <button class="btn" onclick="openNodeModal('label')">
            Tambah Label
          </button>
          <button class="btn" onclick="openNodeModal('line')">
            Tambah Batas Line
          </button>
          <button class="btn btn-success" onclick="exportMapJson()">
            Simpan Map
          </button>
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="closeSettingsModal()">Tutup</button>
        </div>
      </div>
    </div>

    <!-- MODAL EDITOR NODE -->
    <div class="modal-overlay" id="nodeModal">
      <div class="modal-card">
        <h3 id="modalTitle">Kustomisasi Object</h3>
        <div id="modalFormContainer"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeNodeModal()">Batal</button>
          <button
            id="modalSaveBtn"
            class="btn btn-primary"
            onclick="submitNodeModal()"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- Native ES Module: Direct brain.js execution without bundle.js -->
    <script type="module">
      import BrainAIModule from './src/brain.js';
      window.BrainAI = BrainAIModule;
      window.brain = BrainAIModule;
      var activeBrain = BrainAIModule;
      if (activeBrain && typeof activeBrain.loadAllHistory === "function") {
        activeBrain.loadAllHistory().then((data) => {
          console.log("BrainAI Learning Matrix aktif:", data.length, "data points");
        }).catch((e) => console.warn("Load history warning:", e));
      }
      if (typeof renderGrid === "function") {
        renderGrid();
      }
    </script>
    <script>
      var BrainAI = (typeof window !== "undefined" && window.BrainAI)
        ? window.BrainAI
        : (typeof globalThis !== "undefined" && globalThis.BrainAI ? globalThis.BrainAI : null);

      let mapData = { machines: [], cqis: [], labels: [], lines: [] };
      let currentZoom = null,
        initialFitZoom = null,
        showHeatmap = false,
        activePlanning = null;
      let editMode = false,
        draggedNode = null;
      let activeModalType = null,
        editingNodeId = null;
      let totalCols = 55,
        totalRows = 20;

      const mapViewport = document.getElementById("mapViewport");

      function showToast(msg, type = "info") {
        const container = document.getElementById("toastContainer");
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.innerHTML = `<span>${type === "success" ? "✅" : "ℹ️"}</span> ${msg}`;
        container.appendChild(t);
        setTimeout(() => {
          if (t.parentNode) t.remove();
        }, 2500);
      }

      let isWheelTicking = false;
      mapViewport.addEventListener(
        "wheel",
        function (e) {
          if (e.deltaY === 0) return;
          e.preventDefault();
          if (!isWheelTicking) {
            window.requestAnimationFrame(() => {
              mapViewport.scrollLeft += e.deltaY;
              isWheelTicking = false;
            });
            isWheelTicking = true;
          }
        },
        { passive: false },
      );

      async function loadMap() {
        try {
          const res = await fetch("data/map.json");
          if (!res.ok) throw new Error();
          mapData = await res.json();
        } catch (e) {
          try {
            const resL = await fetch(
              "https://raw.githubusercontent.com/IPCQuality/PLANING-MAKER/refs/heads/main/data/map.json",
            );
            if (resL.ok) mapData = await resL.json();
          } catch (err) {}
        }

        if (!mapData || typeof mapData !== "object") {
          mapData = { machines: [], cqis: [], labels: [], lines: [] };
          showToast(
            "Gagal memuat peta layout (map.json). Periksa file data.",
            "info",
          );
        }

        const normalizeNode = (n) => {
          if (!n) return null;
          if (n.position) {
            n.row = n.position.row;
            n.col = n.position.col;
          }
          return n;
        };
        let rawMachines = mapData.machines || [];
        const groupKeys = [
          "machines line a", "machine line a",
          "machines line b", "machine line b",
          "machines line c", "machine line c",
          "machines ww", "machine ww",
          "machines ot", "machine ot"
        ];
        groupKeys.forEach((key) => {
          if (Array.isArray(mapData[key])) {
            rawMachines = rawMachines.concat(mapData[key]);
          }
        });

        const seenIds = new Set();
        mapData.machines = rawMachines
          .filter((m) => {
            if (!m || !m.id) return false;
            if (seenIds.has(m.id)) return false;
            seenIds.add(m.id);
            return true;
          })
          .map(normalizeNode)
          .filter(Boolean);
        let rawCqis = mapData.cqis || [];
        const cqiGroupKeys = [
          "cqi line a", "cqis line a",
          "cqi line b", "cqis line b",
          "cqi line c", "cqis line c",
          "cqi line ot", "cqis line ot",
          "cqi line ww", "cqis line ww"
        ];
        cqiGroupKeys.forEach((key) => {
          if (Array.isArray(mapData[key])) {
            rawCqis = rawCqis.concat(mapData[key]);
          }
        });

        const seenCqiIds = new Set();
        mapData.cqis = rawCqis
          .filter((c) => {
            if (!c || !c.id) return false;
            if (seenCqiIds.has(c.id)) return false;
            seenCqiIds.add(c.id);
            return true;
          })
          .map(normalizeNode)
          .filter(Boolean);
        mapData.labels = (mapData.labels || [])
          .map(normalizeNode)
          .filter(Boolean);
        mapData.lines = mapData.lines || [];

        calculateGridBounds();
        initializeStatuses();
        renderWorkstationButtons();
        applyZoom(true);
      }

      function calculateGridBounds() {
        let maxR = 20,
          maxC = 55;
        const checkMax = (r, c) => {
          if (r > maxR) maxR = r;
          if (c > maxC) maxC = c;
        };

        mapData.machines.forEach((n) => checkMax(n.row, n.col));
        mapData.cqis.forEach((n) => checkMax(n.row, n.col));
        mapData.labels.forEach((n) => checkMax(n.row, n.col));
        mapData.lines.forEach((l) =>
          checkMax(
            (l.row || 1) + (l.height || 1) - 1,
            (l.col || 1) + (l.width || 1) - 1,
          ),
        );

        let buffer = editMode ? 10 : 2;
        totalRows = maxR + buffer;
        totalCols = maxC + buffer;
      }

      const PLANNING_72_MACHINE_IDS = [
        'M-10A-4', 'M-2A-3', 'M-2A-4', 'M-2A-2', 'M-2A-1', 'M-3A-3', 'M-4A-1', 'M-4A-2', 'M-4A-3', 'M-4A-4',
        'M-5A-1', 'M-5A-2', 'M-5A-3', 'M-5A-4', 'M-6A-1', 'M-6A-2', 'M-6A-3', 'M-6A-4', 'M-7A-1', 'M-7A-2',
        'M-7A-3', 'M-7A-4', 'M-8A-1', 'M-8A-2', 'M-8A-3', 'M-8A-4', 'M-9A-1', 'M-9A-2', 'M-9A-3', 'M-9A-4',
        'M-10A-1', 'M-10A-2', 'M-10A-3', 'M-1B-1', 'M-1B-4', 'M-1B-3', 'M-2B-1', 'M-2B-2', 'M-2B-4', 'M-2B-3',
        'M-3B-1', 'M-3B-2', 'M-3B-3', 'M-3B-4', 'M-5B-3', 'M-5B-4', 'M-5B-2', 'M-7B-1', 'M-7B-2', 'M-7B-3',
        'M-7B-4', 'M-9B-1', 'M-9B-2', 'M-9B-3', 'M-10B-3', 'M-10B-2', 'M-10B-1', 'M-2C-1', 'M-2C-2', 'M-3C-3',
        'M-5C-1', 'M-5C-2', 'M-9C-1', 'M-8C-2', 'M-6C-1', 'M-6C-2', 'M-OT-1', 'M-OT-2', 'M-4B-1', 'M-0B-1',
        'M-0B-2', 'M-WW-1'
      ];

      function clearActivePlanning() {
        if (activePlanning || sessionStorage.getItem("active_planning") || localStorage.getItem("last_active_planning")) {
          activePlanning = null;
          sessionStorage.removeItem("active_planning");
          localStorage.removeItem("last_active_planning");
          sessionStorage.removeItem("planning_state");
          showHeatmap = false;
          const btn = document.getElementById("menuHeatmapBtn");
          if (btn) {
            btn.innerText = "Heatmap";
            btn.className = "btn";
          }
        }
      }

      function applyShiftPlanning() {
        clearActivePlanning();
        const idSet = new Set(PLANNING_72_MACHINE_IDS);
        mapData.machines.forEach((m) => {
          m.status = idSet.has(m.id) ? "RUNNING" : "OFF";
        });
        const readyCqiNames = [
          "CQI 1", "CQI 2", "CQI 3", "CQI 4", "CQI 5", "CQI 6", "CQI 7", "CQI 8", "CQI 9", "CQI 10",
          "CQI 11", "CQI 12", "CQI 13", "CQI 14", "CQI 15", "CQI 16", "CQI 17", "CQI 18",
          "CQI 19", "CQI 20", "CQI 24"
        ];
        mapData.cqis.forEach((c) => {
          c.status = readyCqiNames.includes(c.name) ? "READY" : "OFF";
        });
        renderGrid();
        saveInternalStorage();
        showToast("72 Mesin diatur RUNNING sesuai Planning Shift 2!", "success");
      }

      function getActivePlanningSlots() {
        if (!activePlanning) return [];
        if (Array.isArray(activePlanning)) return activePlanning;
        if (Array.isArray(activePlanning.slots)) return activePlanning.slots;
        if (Array.isArray(activePlanning.currentPlan)) return activePlanning.currentPlan;
        if (Array.isArray(activePlanning.planning)) return activePlanning.planning;
        return [];
      }

      function initializeStatuses() {
        try {
          const raw = sessionStorage.getItem("active_planning") || localStorage.getItem("last_active_planning");
          activePlanning = raw ? JSON.parse(raw) : null;
        } catch (e) {}

        const saved = localStorage.getItem("factory_internal_storage");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.machines) && parsed.machines.length > 0) {
              if (parsed.machines)
                parsed.machines.forEach((sm) => {
                  let m = mapData.machines.find((x) => x.id === sm.id);
                  if (m && sm.status) m.status = sm.status;
                });
              if (parsed.cqis)
                parsed.cqis.forEach((sc) => {
                  let c = mapData.cqis.find((x) => x.id === sc.id);
                  if (c && sc.status) c.status = sc.status;
                });
            } else {
              // Default ke status mapData (72 RUNNING sesuai planning)
              mapData.machines.forEach(
                (m) => (m.status = m.status === "RUNNING" ? "RUNNING" : "OFF"),
              );
              mapData.cqis.forEach(
                (c) => (c.status = c.status === "READY" ? "READY" : "OFF"),
              );
              saveInternalStorage();
            }
          } catch (e) {
            saveInternalStorage();
          }
        } else {
          mapData.machines.forEach(
            (m) => (m.status = m.status === "RUNNING" ? "RUNNING" : "OFF"),
          );
          mapData.cqis.forEach(
            (c) => (c.status = c.status === "READY" ? "READY" : "OFF"),
          );
          saveInternalStorage();
        }

        const activeSlots = getActivePlanningSlots();
        if (activeSlots.length > 0) {
          showHeatmap = true;
          const btn = document.getElementById("menuHeatmapBtn");
          if (btn) {
            btn.innerText = "Heatmap Aktif";
            btn.className = "btn btn-success";
          }
        }

        renderGrid();
      }

      function renderWorkstationButtons() {
        const container = document.getElementById("wsBtnContainer");
        if (!container) return;
        container.innerHTML = "";

        const groups = [
          {
            title: "LINE A",
            keys: [
              "0A",
              "1A",
              "2A",
              "3A",
              "4A",
              "5A",
              "6A",
              "7A",
              "8A",
              "9A",
              "10A",
            ],
          },
          {
            title: "LINE B",
            keys: [
              "0B",
              "1B",
              "2B",
              "3B",
              "4B",
              "5B",
              "6B",
              "7B",
              "8B",
              "9B",
              "10B",
              "11B",
            ],
          },
          {
            title: "LINE C",
            keys: ["1C", "2C", "3C", "4C", "5C", "6C", "7C", "8C", "9C", "10C"],
          },
          { title: "LAINNYA", keys: ["WW", "OT"] },
        ];

        groups.forEach((g) => {
          let box = document.createElement("div");
          box.className = "ws-group";
          box.innerHTML = `<div class="ws-group-title">${g.title}</div>`;
          let btns = document.createElement("div");
          btns.className = "ws-group-buttons";
          g.keys.forEach((k) => {
            let b = document.createElement("button");
            b.className = "ws-btn";
            b.innerText = k;
            b.id = "ws-btn-" + k;
            b.onclick = () => toggleWorkstation(k);
            btns.appendChild(b);
          });
          box.appendChild(btns);
          container.appendChild(box);
        });
        updateStatsAndButtons();
      }

      function getMachinesByWs(wsKey) {
        if (!wsKey || !mapData || !mapData.machines) return [];
        const targetWs = String(wsKey).trim().toUpperCase();
        return mapData.machines.filter((m) => {
          // 1. Cek langsung properti workstation pada objek mesin
          if (
            m.workstation &&
            String(m.workstation).trim().toUpperCase() === targetWs
          )
            return true;
          if (m.ws && String(m.ws).trim().toUpperCase() === targetWs)
            return true;
          // 2. Cek ID mesin (misal M-1A-2, M-OT-1, M-WW-1)
          const mId = String(m.id || "");
          const idMatch = mId.match(/M-(\d+[A-C]|WW|OT)-/i) || mId.match(/(\d+[A-C]|WW|OT)/i);
          if (idMatch && idMatch[1].toUpperCase() === targetWs) return true;
          // 3. Gunakan BrainAI.getWorkstationKey jika ada
          const brain = typeof window.BrainAI !== "undefined" ? window.BrainAI : (typeof BrainAI !== "undefined" ? BrainAI : null);
          if (brain && typeof brain.getWorkstationKey === "function") {
            const keyObj = brain.getWorkstationKey(m);
            if (keyObj && String(keyObj).trim().toUpperCase() === targetWs) return true;
          }
          return false;
        });
      }

      function updateStatsAndButtons() {
        const statMachineEl = document.getElementById("statMachine");
        const statCqiEl = document.getElementById("statCqi");
        if (statMachineEl) {
          statMachineEl.innerText = `${mapData.machines.filter((m) => m.status === "RUNNING").length} / ${mapData.machines.length}`;
        }
        if (statCqiEl) {
          statCqiEl.innerText = `${mapData.cqis.filter((c) => c.status === "READY").length} / ${mapData.cqis.length}`;
        }

        const wsKeys = [
          "0A",
          "1A",
          "2A",
          "3A",
          "4A",
          "5A",
          "6A",
          "7A",
          "8A",
          "9A",
          "10A",
          "0B",
          "1B",
          "2B",
          "3B",
          "4B",
          "5B",
          "6B",
          "7B",
          "8B",
          "9B",
          "10B",
          "11B",
          "1C",
          "2C",
          "3C",
          "4C",
          "5C",
          "6C",
          "7C",
          "8C",
          "9C",
          "10C",
          "WW",
          "OT",
        ];

        for (let k of wsKeys) {
          let b = document.getElementById("ws-btn-" + k);
          if (!b) continue;
          let macs = getMachinesByWs(k);
          if (macs.length === 0) {
            b.className = "ws-btn";
            continue;
          }

          const runningCount = macs.filter(
            (m) => m.status === "RUNNING",
          ).length;
          if (runningCount === macs.length) {
            b.className = "ws-btn active-all";
          } else if (runningCount > 0) {
            b.className = "ws-btn active-partial";
          } else {
            b.className = "ws-btn";
          }
        }
      }

      function toggleWorkstation(wsKey) {
        let macs = getMachinesByWs(wsKey);
        if (macs.length === 0) return;

        let tgt = macs.every((m) => m.status === "RUNNING") ? "OFF" : "RUNNING";
        macs.forEach((m) => (m.status = tgt));
        clearActivePlanning();
        renderGrid();
        saveInternalStorage();
      }

      // Fungsi Global Button yang Diperbaiki agar berfungsi & tersimpan
      function setAllMachinesRunning() {
        mapData.machines.forEach((m) => (m.status = "RUNNING"));
        clearActivePlanning();
        renderGrid();
        saveInternalStorage();
      }
      function setAllMachinesOff() {
        mapData.machines.forEach((m) => (m.status = "OFF"));
        clearActivePlanning();
        renderGrid();
        saveInternalStorage();
      }
      function setAllCqiReady() {
        mapData.cqis.forEach((c) => (c.status = "READY"));
        clearActivePlanning();
        renderGrid();
        saveInternalStorage();
      }
      function setAllCqiOff() {
        mapData.cqis.forEach((c) => (c.status = "OFF"));
        clearActivePlanning();
        renderGrid();
        saveInternalStorage();
      }

      function saveInternalStorage() {
        localStorage.setItem(
          "factory_internal_storage",
          JSON.stringify({
            version: "2026-09-18-shift2",
            machines: mapData.machines,
            cqis: mapData.cqis,
          }),
        );
      }

      function toggleSidePanel() {
        const p = document.getElementById("sidePanel");
        p.classList.toggle("closed");
        const btn = document.getElementById("sidebarToggleBtn");
        if (btn) {
          if (p.classList.contains("closed")) {
            btn.style.background = "#ffffff";
            btn.style.borderColor = "var(--border)";
            btn.style.color = "var(--text-main)";
          } else {
            btn.style.background = "#eff6ff";
            btn.style.borderColor = "#bfdbfe";
            btn.style.color = "var(--cqi-ready)";
          }
        }
        setTimeout(() => applyZoom(false), 310);
      }

      function toggleHeatmap() {
        const activeSlots = getActivePlanningSlots();
        if (!activePlanning || activeSlots.length === 0) {
          showToast("Belum ada perencanaan aktif dari halaman Konfigurasi.", "info");
          return;
        }
        showHeatmap = !showHeatmap;

        const btn = document.getElementById("menuHeatmapBtn");
        if (btn) {
          if (showHeatmap) {
            btn.innerText = "Heatmap Aktif";
            btn.className = "btn btn-success";
          } else {
            btn.innerText = "Heatmap Nonaktif";
            btn.className = "btn btn-danger";
          }
        }
        renderGrid();
      }

      function handleSettingsClick() {
        if (editMode) {
          editMode = false;
          document.body.classList.remove("mode-edit");
          document.getElementById("settingsBtn").innerHTML = "Setelan";
          document
            .getElementById("settingsBtn")
            .classList.remove("btn-success");

          document
            .querySelectorAll(".control-landing")
            .forEach((el) => (el.style.display = ""));
          calculateGridBounds();
          renderGrid();
          showToast("Keluar dari Mode Edit", "success");
        } else {
          document.getElementById("settingsModal").classList.add("active");
        }
      }

      function closeSettingsModal() {
        document.getElementById("settingsModal").classList.remove("active");
      }

      function activateEditMode() {
        closeSettingsModal();
        editMode = true;
        document.body.classList.add("mode-edit");

        let btn = document.getElementById("settingsBtn");
        btn.innerHTML = "Selesai Edit";
        btn.classList.add("btn-success");

        document
          .querySelectorAll(".control-landing")
          .forEach((el) => (el.style.display = "none"));

        calculateGridBounds();
        renderGrid();
        showToast(
          "Mode Edit Aktif: Bisa Drag/Drop, Edit (Klik), atau Hapus",
          "info",
        );
      }

      function cycleStatus(node, type) {
        if (type === "machine") {
          node.status = node.status === "RUNNING" ? "OFF" : "RUNNING";
          clearActivePlanning();
        } else if (type === "cqi") {
          node.status = node.status === "READY" ? "OFF" : "READY";
          clearActivePlanning();
        }
        renderGrid();
        saveInternalStorage();
      }

      function renderGrid() {
        const grid = document.getElementById("factoryGrid");
        grid.innerHTML = "";

        const fragment = document.createDocumentFragment();

        grid.style.gridTemplateColumns = `40px repeat(${totalCols}, 78px)`;
        grid.style.gridTemplateRows = `28px repeat(${totalRows}, 52px)`;

        const cellMap = {};

        let corner = document.createElement("div");
        corner.className = "excel-header excel-corner";
        corner.innerText = "R\\C";
        corner.style.gridRow = "1";
        corner.style.gridColumn = "1";
        fragment.appendChild(corner);

        for (let c = 1; c <= totalCols; c++) {
          let h = document.createElement("div");
          h.className = "excel-header";
          h.innerText = c;
          h.style.gridRow = "1";
          h.style.gridColumn = `${c + 1}`;
          fragment.appendChild(h);
        }
        for (let r = 1; r <= totalRows; r++) {
          let h = document.createElement("div");
          h.className = "excel-header";
          h.innerText = r;
          h.style.gridRow = `${r + 1}`;
          h.style.gridColumn = "1";
          fragment.appendChild(h);
          for (let c = 1; c <= totalCols; c++) {
            let cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.style.gridRow = `${r + 1}`;
            cell.style.gridColumn = `${c + 1}`;

            cell.ondragover = (e) => {
              if (editMode) {
                e.preventDefault();
                cell.classList.add("drag-over");
              }
            };
            cell.ondragleave = (e) => {
              cell.classList.remove("drag-over");
            };
            cell.ondrop = (e) => handleDrop(e, r, c, cell);

            cellMap[`${r}-${c}`] = cell;
            fragment.appendChild(cell);
          }
        }

        // 1. Hitung Heatmap State & Densitas Beban Line
        let heatmapState = null;
        const brainInstance = typeof window.BrainAI !== "undefined" ? window.BrainAI : (typeof BrainAI !== "undefined" ? BrainAI : null);
        const activeSlots = getActivePlanningSlots();
        if (
          activeSlots.length > 0 &&
          brainInstance &&
          typeof brainInstance.calculateHeatmapState === "function"
        ) {
          heatmapState = brainInstance.calculateHeatmapState(
            activeSlots,
            mapData,
          );
        }

        if (Array.isArray(mapData.lines)) {
          mapData.lines.forEach((line) => {
            let lEl = document.createElement("div");
            lEl.className = "line-box";
            lEl.id = `line-${line.id}`;
            const row = Math.max(1, line.row || 1);
            const col = Math.max(1, line.col || 1);
            const width = Math.max(1, line.width || 1);
            const height = Math.max(1, line.height || 1);

            lEl.style.gridRow = `${row + 1} / span ${height}`;
            lEl.style.gridColumn = `${col + 1} / span ${width}`;
            if (line.borderColor) lEl.style.borderColor = line.borderColor;

            let headerEl = document.createElement("div");
            headerEl.className = "line-box-header";
            if (line.textColor) headerEl.style.color = line.textColor;
            if (line.borderColor) {
              headerEl.style.borderColor = line.borderColor;
            }
            headerEl.innerText = line.name;

            lEl.appendChild(headerEl);

            if (editMode) {
              headerEl.title =
                "Klik untuk edit parameter / Tarik teks ini untuk memindahkan posisi batas line";
              headerEl.draggable = true;
              headerEl.ondragstart = (e) => {
                e.stopPropagation();
                draggedNode = { id: line.id, type: "line" };
                e.dataTransfer.effectAllowed = "move";
                setTimeout(() => {
                  lEl.style.opacity = "0.4";
                }, 0);
              };
              headerEl.ondragend = () => {
                lEl.style.opacity = "1";
                draggedNode = null;
              };
              headerEl.onclick = (e) => {
                e.stopPropagation();
                openEditModal(line, "line");
              };

              let delBtn = document.createElement("div");
              delBtn.className = "del-btn";
              delBtn.innerText = "×";
              delBtn.title = "Hapus Batas Line";
              delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteNode(line.id, "line");
              };
              lEl.appendChild(delBtn);

              let resizer = document.createElement("div");
              resizer.className = "resize-handle";
              resizer.title =
                "Tarik sudut ini untuk mengubah panjang/lebar batas line";
              resizer.onmousedown = (e) => initResizeLine(e, line, lEl);
              lEl.appendChild(resizer);
            }

            fragment.appendChild(lEl);
          });
        }

        const assignments = new Map();
        const plannedCqiIds = new Set();
        let cqiColorMap = {};

        if (heatmapState && heatmapState.cqiColorMap) {
          cqiColorMap = heatmapState.cqiColorMap;
        }

        if (activeSlots.length > 0) {
          const fallbackColors = [
            "#be123c",
            "#ea580c",
            "#d97706",
            "#4f46e5",
            "#0284c7",
            "#059669",
            "#7c3aed",
            "#c026d3",
            "#0891b2",
            "#16a34a",
          ];
          activeSlots.forEach((s, idx) => {
            if (s && s.machines) {
              let cqiObj = s.cqi;
              if (!cqiObj && s.name) cqiObj = { id: s.name, name: s.name };
              if (!cqiObj && s.cqiNum) cqiObj = { id: `CQI ${s.cqiNum}`, name: `CQI ${s.cqiNum}` };
              if (!cqiObj) return;

              const cqiKey = cqiObj.id || cqiObj.name;
              if (!cqiColorMap[cqiKey]) {
                cqiColorMap[cqiKey] =
                  fallbackColors[idx % fallbackColors.length];
              }
              if (cqiObj.name && !cqiColorMap[cqiObj.name]) {
                cqiColorMap[cqiObj.name] = cqiColorMap[cqiKey];
              }
              if (cqiObj.id && !cqiColorMap[cqiObj.id]) {
                cqiColorMap[cqiObj.id] = cqiColorMap[cqiKey];
              }

              s.machines.forEach((m) => {
                const k1 = typeof m === "string" ? m.trim() : String(m.id || m.name || "").trim();
                const k2 = typeof m === "object" ? String(m.name || m.id || "").trim() : k1;
                if (k1) assignments.set(k1, cqiObj);
                if (k2) assignments.set(k2, cqiObj);
              });
              if (s.machines.length > 0) {
                if (cqiObj.id) plannedCqiIds.add(cqiObj.id);
                if (cqiObj.name) plannedCqiIds.add(cqiObj.name);
              }
            }
          });
        }

        const appendNode = (node, type) => {
          let cell = cellMap[`${node.row}-${node.col}`];
          if (!cell) return;
          let div = document.createElement("div");
          div.className = `node node-${type} ${node.status || ""}`;
          div.id = node.id;
          div.innerHTML = `<span>${node.name}</span>`;

          if (type === "machine") {
            let planCqi =
              assignments.get(String(node.id || "").trim()) ||
              assignments.get(String(node.name || "").trim());
            if (planCqi) {
              div.classList.add("planned");
              let nodeColor = cqiColorMap[planCqi.id] || cqiColorMap[planCqi.name] || "#16a34a";
              if (showHeatmap && !editMode) {
                div.style.backgroundColor = nodeColor;
                div.style.borderColor = nodeColor;
                div.style.color = "#ffffff";
                div.style.fontWeight = "700";
                div.style.boxShadow = `0 2px 8px ${nodeColor}80`;
                div.innerHTML = `<span style="color:#ffffff; font-weight:700;">${node.name}</span>`;
                div.innerHTML += `<span class="heatmap-badge" style="background:#ffffff; color:${nodeColor}; font-weight:900;">${planCqi.name}</span>`;
              }
            }
          } else if (type === "cqi") {
            if (plannedCqiIds.has(node.id)) {
              div.classList.add("planned-target");
              let nodeColor = cqiColorMap[node.id] || cqiColorMap[node.name] || "#16a34a";
              if (showHeatmap && !editMode) {
                div.style.backgroundColor = nodeColor;
                div.style.borderColor = nodeColor;
                div.style.color = "#ffffff";
                div.style.fontWeight = "800";
                div.style.boxShadow = `0 0 0 2px #ffffff, 0 4px 14px ${nodeColor}aa`;
                div.innerHTML = `<span style="color:#ffffff; font-weight:800;">${node.name}</span>`;
              }
            }
          }

          if (editMode) {
            div.draggable = true;
            div.ondragstart = (e) => {
              draggedNode = { id: node.id, type: type };
              e.dataTransfer.effectAllowed = "move";
              setTimeout(() => (div.style.opacity = "0.5"), 0);
            };
            div.ondragend = () => {
              div.style.opacity = "1";
              draggedNode = null;
            };
            div.onclick = (e) => {
              e.stopPropagation();
              openEditModal(node, type);
            };

            let d = document.createElement("div");
            d.className = "del-btn";
            d.innerText = "X";
            d.onclick = (e) => {
              e.stopPropagation();
              deleteNode(node.id, type);
            };
            div.appendChild(d);
          } else {
            if (type === "machine" || type === "cqi") {
              div.onclick = (e) => {
                e.stopPropagation();
                cycleStatus(node, type);
              };
            }
          }

          cell.appendChild(div);
        };

        mapData.machines.forEach((m) => appendNode(m, "machine"));
        mapData.cqis.forEach((c) => appendNode(c, "cqi"));
        mapData.labels.forEach((l) => appendNode(l, "label"));

        if (showHeatmap && assignments.size > 0 && !editMode) {
          const svgNS = "http://www.w3.org/2000/svg";
          let svg = document.createElementNS(svgNS, "svg");
          svg.style.position = "absolute";
          svg.style.top = "0";
          svg.style.left = "0";
          svg.style.width = "100%";
          svg.style.height = "100%";
          svg.style.pointerEvents = "none";
          svg.style.zIndex = "8";
          const getCenter = (n) => ({
            x: 40 + (n.col - 1) * 78 + 39,
            y: 28 + (n.row - 1) * 52 + 26,
          });

          // Group machines by assigned CQI slot for sequential chaining
          const cqiMachineGroups = new Map();
          const processedMachines = new Set();

          assignments.forEach((cqiTarget, mId) => {
            let mac = mapData.machines.find(
              (x) =>
                String(x.id || "").trim() === mId ||
                String(x.name || "").trim() === mId,
            );
            if (!mac || processedMachines.has(mac.id || mac.name)) return;
            processedMachines.add(mac.id || mac.name);

            let tgt = mapData.cqis.find(
              (x) =>
                String(x.id || "").trim() ===
                  String(cqiTarget.id || cqiTarget.name || cqiTarget).trim() ||
                String(x.name || "").trim() ===
                  String(cqiTarget.name || cqiTarget.id || cqiTarget).trim(),
            );
            if (!tgt) return;

            const cqiKey = tgt.id || tgt.name;
            if (!cqiMachineGroups.has(cqiKey)) {
              cqiMachineGroups.set(cqiKey, { cqi: tgt, machines: [] });
            }
            cqiMachineGroups.get(cqiKey).machines.push(mac);
          });

          // Function to generate sequential Manhattan waypoints with mandatory label traversal when crossing workstations
          function generateSequentialWaypoints(tgt, rawMachines) {
            if (!rawMachines || rawMachines.length === 0) return [];

            const getNodeCoords = (node) => ({
              row: Number(node.row !== undefined ? node.row : (node.position ? node.position.row : 0)),
              col: Number(node.col !== undefined ? node.col : (node.position ? node.position.col : 0))
            });

            const getWs = (node) => {
              if (!node) return "";
              if (node.ws) return String(node.ws).trim().toUpperCase();
              const name = String(node.name || "");
              const id = String(node.id || "");
              const match = id.match(/M-([0-9]+[A-C]|WW|OT)/i) || name.match(/([0-9]+[A-C]|WW|OT)/i);
              if (match) return match[1].toUpperCase();
              if (id.includes("CQI-19") || name.includes("CQI 19")) return "OT";
              if (id.includes("CQI-24") || name.includes("CQI 24")) return "WW";
              if (id.includes("CQI-") || name.includes("CQI")) {
                const num = parseInt(id.replace(/\D/g, "") || name.replace(/\D/g, ""));
                if (num >= 1 && num <= 10) return num + "A";
              }
              const coords = getNodeCoords(node);
              if (mapData.labels && mapData.labels.length > 0) {
                let closest = mapData.labels[0], minD = Infinity;
                mapData.labels.forEach(l => {
                  const lc = getNodeCoords(l);
                  const d = Math.hypot(lc.row - coords.row, lc.col - coords.col);
                  if (d < minD) { minD = d; closest = l; }
                });
                if (minD < 5) return String(closest.name || "").toUpperCase();
              }
              return "";
            };

            const getLabelNodeForWs = (ws, nodeCoords) => {
              if (!ws) return null;
              const l = mapData.labels.find(x => String(x.name || "").toUpperCase() === ws.toUpperCase() || String(x.id || "").toUpperCase() === ("L-" + ws).toUpperCase());
              if (l) return getNodeCoords(l);
              if (mapData.labels.length > 0 && nodeCoords) {
                let best = null, minDist = Infinity;
                mapData.labels.forEach(lbl => {
                  const lc = getNodeCoords(lbl);
                  const d = Math.hypot(lc.row - nodeCoords.row, lc.col - nodeCoords.col);
                  if (d < minDist) { minDist = d; best = lc; }
                });
                return best;
              }
              return null;
            };

            const cqiCoords = getNodeCoords(tgt);
            const remaining = [...rawMachines];
            const ordered = [];
            let current = cqiCoords;
            let currentWs = getWs(tgt);

            // Sequential traversal prioritizing same workstation machines before branching out
            while (remaining.length > 0) {
              let nearestIdx = 0;
              let minDist = Infinity;
              for (let i = 0; i < remaining.length; i++) {
                const mc = remaining[i];
                const mcCoords = getNodeCoords(mc);
                const mcWs = getWs(mc);
                const sameWsBonus = (mcWs && mcWs === currentWs) ? 0 : 1000;
                const d = Math.hypot(mcCoords.row - current.row, mcCoords.col - current.col) + sameWsBonus;
                if (d < minDist) {
                  minDist = d;
                  nearestIdx = i;
                }
              }
              const [nextMc] = remaining.splice(nearestIdx, 1);
              ordered.push(nextMc);
              current = getNodeCoords(nextMc);
              currentWs = getWs(nextMc);
            }

            // Construct orthogonal path: when transitioning between different workstations, route via node labels
            const seqNodes = [tgt, ...ordered];
            const waypoints = [getNodeCoords(tgt)];

            for (let i = 0; i < seqNodes.length - 1; i++) {
              const u = seqNodes[i];
              const v = seqNodes[i + 1];
              const p1 = getNodeCoords(u);
              const p2 = getNodeCoords(v);
              const ws1 = getWs(u);
              const ws2 = getWs(v);

              if (ws1 && ws2 && ws1 !== ws2) {
                // Crossing to another workstation: MANDATORY routing through node labels
                const label1 = getLabelNodeForWs(ws1, p1);
                const label2 = getLabelNodeForWs(ws2, p2);

                if (label1 && label2) {
                  // Step to label1 (down/up workstation aisle)
                  if (p1.row !== label1.row || p1.col !== label1.col) {
                    if (p1.col === label1.col) {
                      waypoints.push(label1);
                    } else {
                      waypoints.push({ row: label1.row, col: p1.col });
                      waypoints.push(label1);
                    }
                  }
                  // Step from label1 to label2 along the label aisle / corridor
                  if (label1.row !== label2.row || label1.col !== label2.col) {
                    if (label1.row === label2.row || label1.col === label2.col) {
                      waypoints.push(label2);
                    } else {
                      waypoints.push({ row: label1.row, col: label2.col });
                      waypoints.push(label2);
                    }
                  }
                  // Step from label2 to p2 inside target workstation
                  if (label2.row !== p2.row || label2.col !== p2.col) {
                    if (label2.col === p2.col) {
                      waypoints.push(p2);
                    } else {
                      waypoints.push({ row: label2.row, col: p2.col });
                      waypoints.push(p2);
                    }
                  }
                  continue;
                }
              }

              // Same workstation or direct connection
              if (p1.row === p2.row || p1.col === p2.col) {
                waypoints.push(p2);
              } else {
                waypoints.push({ row: p1.row, col: p2.col });
                waypoints.push(p2);
              }
            }

            // Remove duplicate adjacent points
            const unique = [];
            waypoints.forEach(pt => {
              if (unique.length === 0) {
                unique.push(pt);
              } else {
                const last = unique[unique.length - 1];
                if (Math.abs(last.row - pt.row) > 0.01 || Math.abs(last.col - pt.col) > 0.01) {
                  unique.push(pt);
                }
              }
            });

            // Simplify collinear points so rounded corners apply cleanly at every bend
            if (unique.length <= 2) return unique;
            const simplified = [unique[0]];
            for (let i = 1; i < unique.length - 1; i++) {
              const prev = simplified[simplified.length - 1];
              const curr = unique[i];
              const next = unique[i + 1];

              const d1R = Math.sign(curr.row - prev.row);
              const d1C = Math.sign(curr.col - prev.col);
              const d2R = Math.sign(next.row - curr.row);
              const d2C = Math.sign(next.col - curr.col);

              if (d1R !== d2R || d1C !== d2C) {
                simplified.push(curr);
              }
            }
            simplified.push(unique[unique.length - 1]);
            return simplified;
          }

          function buildRoundedPath(pts, radius = 14) {
            if (!pts || pts.length === 0) return "";
            if (pts.length === 1) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            if (pts.length === 2) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;

            let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            for (let i = 1; i < pts.length - 1; i++) {
              const prev = pts[i - 1];
              const curr = pts[i];
              const next = pts[i + 1];

              const v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
              const v2 = { x: next.x - curr.x, y: next.y - curr.y };

              const len1 = Math.hypot(v1.x, v1.y);
              const len2 = Math.hypot(v2.x, v2.y);

              if (len1 < 0.001 || len2 < 0.001) continue;

              const u1 = { x: v1.x / len1, y: v1.y / len1 };
              const u2 = { x: v2.x / len2, y: v2.y / len2 };

              const dot = u1.x * u2.x + u1.y * u2.y;
              if (dot > 0.98) {
                d += ` L ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
                continue;
              }

              const r = Math.min(radius, len1 / 2, len2 / 2);

              const startTurn = { x: curr.x - u1.x * r, y: curr.y - u1.y * r };
              const endTurn = { x: curr.x + u2.x * r, y: curr.y + u2.y * r };

              d += ` L ${startTurn.x.toFixed(1)} ${startTurn.y.toFixed(1)}`;
              d += ` Q ${curr.x.toFixed(1)} ${curr.y.toFixed(1)} ${endTurn.x.toFixed(1)} ${endTurn.y.toFixed(1)}`;
            }

            const last = pts[pts.length - 1];
            d += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;
            return d;
          }

          // Draw sequential chain for each CQI group: CQI -> mc1 -> mc2 -> ...
          cqiMachineGroups.forEach((group) => {
            const tgt = group.cqi;
            const rawMachines = group.machines;
            if (rawMachines.length === 0) return;

            let pathColor = cqiColorMap[tgt.id] || cqiColorMap[tgt.name] || "#16a34a";

            const waypoints = generateSequentialWaypoints(tgt, rawMachines);
            if (!waypoints || waypoints.length === 0) return;

            let pixelPoints = waypoints.map((pt) => getCenter(pt));
            let dPath = buildRoundedPath(pixelPoints, 14);

            let path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", dPath);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", pathColor);
            path.setAttribute("stroke-width", "3");
            path.setAttribute("stroke-linejoin", "round");
            path.setAttribute("stroke-linecap", "round");
            path.setAttribute("class", "heatmap-flow-line");
            svg.appendChild(path);

            // Node marker at start (CQI)
            let startCircle = document.createElementNS(svgNS, "circle");
            startCircle.setAttribute("cx", pixelPoints[0].x.toFixed(1));
            startCircle.setAttribute("cy", pixelPoints[0].y.toFixed(1));
            startCircle.setAttribute("r", "5");
            startCircle.setAttribute("fill", pathColor);
            startCircle.setAttribute("stroke", "#ffffff");
            startCircle.setAttribute("stroke-width", "1.5");
            svg.appendChild(startCircle);

            // Node marker at end (last machine)
            if (pixelPoints.length > 1) {
              const lastPt = pixelPoints[pixelPoints.length - 1];
              let endCircle = document.createElementNS(svgNS, "circle");
              endCircle.setAttribute("cx", lastPt.x.toFixed(1));
              endCircle.setAttribute("cy", lastPt.y.toFixed(1));
              endCircle.setAttribute("r", "4");
              endCircle.setAttribute("fill", "#ffffff");
              endCircle.setAttribute("stroke", pathColor);
              endCircle.setAttribute("stroke-width", "2");
              svg.appendChild(endCircle);
            }
          });
          fragment.appendChild(svg);
        }

        grid.appendChild(fragment);
        updateStatsAndButtons();
      }

      function handleDropAt(r, c) {
        if (!editMode || !draggedNode) return;
        let list = mapData[draggedNode.type + "s"];
        if (!list) return;
        let targetObj = list.find((x) => x.id === draggedNode.id);
        if (targetObj) {
          targetObj.row = r;
          targetObj.col = c;
          if (targetObj.position) {
            targetObj.position.row = r;
            targetObj.position.col = c;
          }
          calculateGridBounds();
          clearActivePlanning();
          renderGrid();
          saveInternalStorage();
          showToast(
            `Posisi ${targetObj.name || targetObj.id} berhasil dipindahkan ke Row ${r}, Col ${c}`,
            "success",
          );
        }
        draggedNode = null;
      }

      function handleDrop(e, r, c, cellElem) {
        if (!editMode || !draggedNode) return;
        e.preventDefault();
        if (cellElem) cellElem.classList.remove("drag-over");
        handleDropAt(r, c);
      }

      function initResizeLine(e, line, lEl) {
        e.stopPropagation();
        e.preventDefault();

        const startX = e.clientX;
        const startY = e.clientY;
        const startWidth = line.width || 4;
        const startHeight = line.height || 4;
        const cellWidth = 78;
        const cellHeight = 52;
        const zoom = currentZoom || 1;

        let newW = startWidth;
        let newH = startHeight;

        function onMouseMove(moveEvent) {
          moveEvent.preventDefault();
          const deltaX = (moveEvent.clientX - startX) / zoom;
          const deltaY = (moveEvent.clientY - startY) / zoom;

          const colsDelta = Math.round(deltaX / cellWidth);
          const rowsDelta = Math.round(deltaY / cellHeight);

          newW = Math.max(1, startWidth + colsDelta);
          newH = Math.max(1, startHeight + rowsDelta);

          lEl.style.gridColumn = `${(line.col || 1) + 1} / span ${newW}`;
          lEl.style.gridRow = `${(line.row || 1) + 1} / span ${newH}`;
        }

        function onMouseUp() {
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);

          line.width = newW;
          line.height = newH;
          calculateGridBounds();
          renderGrid();
          showToast(
            `Ukuran ${line.name} berhasil diubah: ${line.width} kolom × ${line.height} baris`,
            "success",
          );
        }

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      }

      function deleteNode(id, type) {
        let typeLabel =
          type === "line"
            ? "Batas Line"
            : type === "machine"
              ? "Mesin"
              : type === "cqi"
                ? "CQI"
                : "Label";
        if (!confirm(`Hapus ${typeLabel} ini?`)) return;
        let key = type + "s";
        if (Array.isArray(mapData[key])) {
          mapData[key] = mapData[key].filter((x) => x.id !== id);
        }
        clearActivePlanning();
        calculateGridBounds();
        renderGrid();
        saveInternalStorage();
        showToast(`${typeLabel} berhasil dihapus`, "info");
      }

      function openNodeModal(type) {
        closeSettingsModal();
        activeModalType = type;
        editingNodeId = null;

        let centerRow = Math.max(
          1,
          Math.floor(
            (mapViewport.scrollTop + mapViewport.clientHeight / 2) /
              (52 * (currentZoom || 1)),
          ),
        );
        let centerCol = Math.max(
          1,
          Math.floor(
            (mapViewport.scrollLeft + mapViewport.clientWidth / 2) /
              (78 * (currentZoom || 1)),
          ),
        );

        buildModalForm(type, { name: "", row: centerRow, col: centerCol });
        document.getElementById("nodeModal").classList.add("active");
      }

      function openEditModal(node, type) {
        activeModalType = type;
        editingNodeId = node.id;
        buildModalForm(type, node);
        document.getElementById("nodeModal").classList.add("active");
      }

      function buildModalForm(type, data) {
        const c = document.getElementById("modalFormContainer");
        document.getElementById("modalTitle").innerText = editingNodeId
          ? `Edit ${type.toUpperCase()}`
          : `Tambah ${type.toUpperCase()}`;

        let html = `<div class="form-group"><label>Nama</label><input type="text" id="nName" class="form-control" value="${data.name || ""}" placeholder="Nama..." required></div>`;

        if (type === "line") {
          html += `
                <div class="form-row">
                    <div class="form-group"><label>Row (Y)</label><input type="number" id="nRow" class="form-control" value="${data.row || 1}"></div>
                    <div class="form-group"><label>Col (X)</label><input type="number" id="nCol" class="form-control" value="${data.col || 1}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Tinggi (Rows)</label><input type="number" id="nHeight" class="form-control" value="${data.height || 4}"></div>
                    <div class="form-group"><label>Lebar (Cols)</label><input type="number" id="nWidth" class="form-control" value="${data.width || 4}"></div>
                </div>
                <div class="form-group"><label>Warna Garis (Hex)</label><input type="text" id="nBorder" class="form-control" value="${data.borderColor || "#3b82f6"}"></div>
                <div class="form-group"><label>Warna Teks (Hex)</label><input type="text" id="nText" class="form-control" value="${data.textColor || "#60a5fa"}"></div>
            `;
        } else {
          html += `
                <div class="form-row">
                    <div class="form-group"><label>Row (Y)</label><input type="number" id="nRow" class="form-control" value="${data.row || 1}"></div>
                    <div class="form-group"><label>Col (X)</label><input type="number" id="nCol" class="form-control" value="${data.col || 1}"></div>
                </div>
            `;
          if (type === "machine") {
            html += `
                  <div class="form-group"><label>Cluster</label><input type="text" id="nCluster" class="form-control" value="${data.cluster || ""}"></div>
                  <div class="form-group"><label>Qty Timbang</label><input type="number" id="nQty" class="form-control" value="${data.qtytimbang || 8}"></div>
                `;
          } else if (type === "cqi") {
            html += `<div class="form-group"><label>Prioritas Mesin (Pisahkan dg koma)</label><input type="text" id="nPrio" class="form-control" value="${(data.priority || []).join(",")}"></div>`;
          }
        }

        c.innerHTML = html;
        setTimeout(() => {
          const ni = document.getElementById("nName");
          if (ni) ni.focus();
        }, 50);
      }

      function closeNodeModal() {
        document.getElementById("nodeModal").classList.remove("active");
      }

      function submitNodeModal() {
        const nameEl = document.getElementById("nName");
        let name = nameEl ? nameEl.value.trim() : "";
        if (!name) {
          alert("Nama wajib diisi");
          return;
        }

        let rVal = parseInt(document.getElementById("nRow").value, 10) || 1;
        let cVal = parseInt(document.getElementById("nCol").value, 10) || 1;

        let list = mapData[activeModalType + "s"];
        let targetObj = editingNodeId
          ? list.find((x) => x.id === editingNodeId)
          : null;

        if (!targetObj) {
          targetObj = {
            id: activeModalType.toUpperCase().charAt(0) + "-" + Date.now(),
            status: "OFF",
          };
          list.push(targetObj);
        }

        targetObj.name = name;
        targetObj.row = rVal;
        targetObj.col = cVal;
        targetObj.position = { row: rVal, col: cVal };

        if (activeModalType === "line") {
          targetObj.height =
            parseInt(document.getElementById("nHeight").value, 10) || 4;
          targetObj.width =
            parseInt(document.getElementById("nWidth").value, 10) || 4;
          targetObj.borderColor =
            document.getElementById("nBorder").value || "#3b82f6";
          targetObj.textColor =
            document.getElementById("nText").value || "#60a5fa";
        } else if (activeModalType === "machine") {
          targetObj.cluster = document.getElementById("nCluster")
            ? document.getElementById("nCluster").value
            : "";
          targetObj.qtytimbang = document.getElementById("nQty")
            ? document.getElementById("nQty").value
            : 8;
        } else if (activeModalType === "cqi") {
          let prioRaw = document.getElementById("nPrio")
            ? document.getElementById("nPrio").value
            : "";
          targetObj.priority = prioRaw
            .split(",")
            .map((s) => s.trim())
            .filter((s) => s.length > 0);
        }

        closeNodeModal();
        clearActivePlanning();
        calculateGridBounds();
        renderGrid();
        saveInternalStorage();
      }

      function exportMapJson() {
        let blob = new Blob([JSON.stringify(mapData, null, 2)], {
          type: "application/json",
        });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "map.json";
        a.click();
        closeSettingsModal();
      }

      function applyZoom(init = false) {
        const currentGridWidth = 40 + totalCols * 78;
        const currentGridHeight = 28 + totalRows * 52;

        let mx = mapViewport.clientWidth / currentGridWidth;
        let my = mapViewport.clientHeight / currentGridHeight;
        let fitZoom = Math.max(mx, my);

        if (!isFinite(fitZoom) || fitZoom <= 0) fitZoom = 0.1;
        if (init || currentZoom === null) {
          currentZoom = fitZoom;
          initialFitZoom = fitZoom;
        }
        currentZoom = Math.max(0.1, Math.min(3, currentZoom));

        document.getElementById("factoryGrid").style.transform =
          `scale(${currentZoom})`;
        document.getElementById("gridWrapper").style.width =
          `${currentGridWidth * currentZoom}px`;
        document.getElementById("gridWrapper").style.height =
          `${currentGridHeight * currentZoom}px`;

        updateZoomButtons();
      }

      function updateZoomButtons() {
        const badge = document.getElementById("zoomBadge");
        if (badge) {
          badge.innerText = `${Math.round((currentZoom || 1) * 100)}%`;
        }
      }

      function resetZoom() {
        if (initialFitZoom) {
          currentZoom = initialFitZoom;
        } else {
          currentZoom = 1;
        }
        applyZoom();
        showToast("Zoom dikembalikan ke ukuran fit peta", "info");
      }

      function zoomIn() {
        currentZoom = (currentZoom || 1) + 0.1;
        applyZoom();
      }
      function zoomOut() {
        currentZoom = (currentZoom || 1) - 0.1;
        applyZoom();
      }

      function goToConfig() {
        let runM = mapData.machines.filter((m) => m.status === "RUNNING");
        let rdyC = mapData.cqis.filter((c) => c.status === "READY");

        if (runM.length === 0 || rdyC.length === 0) {
          showToast(
            "Mohon pastikan setidaknya ada mesin RUNNING dan meja CQI READY sebelum lanjut ke Konfigurasi.",
            "info",
          );
          return;
        }

        saveInternalStorage();
        sessionStorage.setItem(
          "planning_state",
          JSON.stringify({
            machines: runM,
            cqis: rdyC,
            labels: mapData.labels,
          }),
        );
        window.location.href = "config.html";
      }

      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => applyZoom(), 150);
      });

      // Universal Modal Scroll Lock Manager & Backdrop handlers
      function updateModalScrollLock() {
        const hasActiveModal =
          document.querySelector(".modal-overlay.active") !== null;
        if (hasActiveModal) {
          document.documentElement.classList.add("modal-open");
          document.body.classList.add("modal-open");
        } else {
          document.documentElement.classList.remove("modal-open");
          document.body.classList.remove("modal-open");
        }
      }

      const modalObserver = new MutationObserver(updateModalScrollLock);
      document.querySelectorAll(".modal-overlay").forEach((modal) => {
        modalObserver.observe(modal, {
          attributes: true,
          attributeFilter: ["class", "style"],
        });
        modal.addEventListener(
          "wheel",
          (e) => {
            if (e.target === modal) e.preventDefault();
          },
          { passive: false },
        );
        modal.addEventListener(
          "touchmove",
          (e) => {
            if (e.target === modal) e.preventDefault();
          },
          { passive: false },
        );
      });

      // Unregister any existing Service Worker and clean PWA caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => caches.delete(key));
        });
      }

      loadMap();

      window.goToConfig = goToConfig;
      window.zoomIn = zoomIn;
      window.zoomOut = zoomOut;
      window.resetZoom = resetZoom;
    </script>
  </body>
</html>
